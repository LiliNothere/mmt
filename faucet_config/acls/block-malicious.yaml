# ACL động cho ML, một ACL cho mỗi cổng host (ingress): block-malicious-<switch>-p<port>.
# Bình thường chỉ có rule allow-all. Khi phát hiện tấn công, ML service chèn rule
# {actions: {allow: false}} lên ĐẦU danh sách của cổng nguồn tấn công; khi hết hạn thì xoá.
# Faucet tự reload nhờ FAUCET_CONFIG_STAT_RELOAD=1.
acls:
  block-malicious-s1-p1:
  - rule:
      actions:
        allow: true
  block-malicious-s1-p2:
  - rule:
      actions:
        allow: true
